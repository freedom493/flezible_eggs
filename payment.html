<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment — Flezible Eggs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            egg: '#f7f1e8',
            cream: '#fffaf4',
            forest: '#173f2d',
            clay: '#b75b32',
            clayDark: '#8a3f24',
            rust: '#d07f53',
            ink: '#1d1a17',
            line: '#e7dccd',
            muted: '#756a62',
            success: '#1a7a4d'
          },
          fontFamily: {
            display: ['Fraunces', 'serif'],
            body: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body class="bg-cream text-ink font-body min-h-screen">
  <header class="site-header">
    <div class="container-shell flex items-center justify-between py-4">
      <a href="./index.html" class="brand-mark">
        <span class="brand-emblem">🥚</span>
        <span>Flezible Eggs</span>
      </a>
      <nav class="hidden md:flex items-center gap-6 text-sm font-semibold text-muted">
        <a href="./index.html">Home</a>
        <a href="./dashboard.html">Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="container-shell py-10 md:py-14">
    <div class="site-card p-6 md:p-8 max-w-3xl mx-auto">
      <div id="paymentStatusBox" class="hidden mb-6 rounded-2xl border border-line bg-egg p-4 text-sm"></div>

      <div class="grid md:grid-cols-2 gap-8">
        <section>
          <p class="text-xs uppercase tracking-[0.2em] text-clay font-bold mb-2">Payment</p>
          <h1 class="font-display text-4xl mb-3">Choose how to pay</h1>
          <p class="text-muted">Order ID: <strong id="orderIdText" class="text-ink"></strong></p>
          <p class="mt-2 text-muted">Total due: <strong id="orderTotalText"
              class="text-xl text-clay font-bold"></strong></p>

          <div class="mt-6 space-y-3">
            <button id="payOnDeliveryBtn" class="button-primary w-full">Pay on delivery</button>
            <button id="payNowBtn" class="button-secondary w-full">Pay now</button>
          </div>
        </section>

        <section id="payNowPanel" class="hidden">
          <div class="rounded-3xl bg-egg border border-line p-5">
            <h2 class="font-display text-2xl mb-4">Bank transfer</h2>
            <div class="space-y-3 text-sm">
              <div><span class="text-muted">Bank:</span> <strong id="bankName" class="block text-ink"></strong></div>
              <div><span class="text-muted">Account number:</span> <strong id="bankAccountNumber"
                  class="block text-ink"></strong></div>
              <div><span class="text-muted">Account name:</span> <strong id="bankAccountName"
                  class="block text-ink"></strong></div>
              <div><span class="text-muted">Payment description:</span> <strong id="paymentDescription"
                  class="block text-ink break-all"></strong></div>
            </div>

            <div class="mt-5">
              <label for="receiptInput" class="input-label">Upload proof of payment</label>
              <input id="receiptInput" type="file" accept="image/png,image/jpeg,image/webp" class="field mt-2 p-3">
              <p class="text-xs text-muted mt-2">Accepted: JPG, PNG, WEBP · Max size: 5MB</p>
            </div>

            <button id="uploadReceiptBtn" class="button-primary w-full mt-5">Submit payment proof</button>
            <div id="uploadMessage" class="mt-3 text-sm min-h-5"></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container-shell flex flex-col md:flex-row items-center justify-between gap-4">
      <p>© 2026 Flezible Eggs</p>
      <nav class="flex gap-5 text-sm text-muted">
        <a href="./about.html">About</a>
        <a href="./terms.html">Terms</a>
        <a href="./privacy.html">Privacy</a>
      </nav>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/script.js"></script>
</body>

</html>
