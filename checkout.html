<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Flezible Eggs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            egg: '#f7f1e8',
            cream: '#fffaf4',
            forest: '#173f2d',
            clay: '#b75b32',
            clayDark: '#8a3f24',
            rust: '#d07f53',
            ink: '#1d1a17',
            line: '#e7dccd',
            muted: '#756a62',
            success: '#1a7a4d'
          },
          fontFamily: {
            display: ['Fraunces', 'serif'],
            body: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body class="bg-cream text-ink font-body min-h-screen">
  <header class="site-header">
    <div class="container-shell flex items-center justify-between py-4">
      <a href="./index.html" class="brand-mark">
        <span class="brand-emblem">🥚</span>
        <span>Flezible Eggs</span>
      </a>
      <nav class="hidden md:flex items-center gap-6 text-sm font-semibold text-muted">
        <a href="./index.html">Home</a>
        <a href="./about.html">About</a>
        <a href="./dashboard.html">Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="container-shell py-10 md:py-14">
    <div class="mb-8">
      <p class="text-xs uppercase tracking-[0.2em] text-clay font-bold mb-2">Checkout</p>
      <h1 class="font-display text-4xl md:text-5xl text-ink">Finalise your egg drop</h1>
    </div>

    <div class="grid lg:grid-cols-[1.1fr_0.9fr] gap-6">
      <section class="site-card p-6 md:p-8">
        <div id="checkoutFormWrap">
          <div class="mb-6">
            <h2 class="font-display text-2xl mb-2">Delivery details</h2>
            <p class="text-sm text-muted">We’ll confirm your order before it leaves the farm.</p>
          </div>

          <div class="space-y-5">
            <div>
              <label for="deliveryAddress" class="input-label">Delivery address</label>
              <textarea id="deliveryAddress" rows="3" class="field" placeholder="Hostel / room / landmark"></textarea>
            </div>

            <div>
              <label for="preparation" class="input-label">Preparation</label>
              <select id="preparation" class="field">
                <option value="raw">Raw</option>
                <option value="cooked">Cooked</option>
              </select>
            </div>

            <div>
              <label for="note" class="input-label">Optional note</label>
              <textarea id="note" rows="3" class="field" placeholder="Any extra details for your delivery?"></textarea>
            </div>
          </div>
        </div>
      </section>

      <aside class="site-card p-6 md:p-8">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-display text-2xl">Order summary</h2>
          <span id="checkoutItemCount" class="pill pill-soft">0 items</span>
        </div>

        <div id="checkoutItems" class="space-y-4"></div>

        <div class="mt-6 border-t border-line pt-4">
          <div class="flex justify-between text-sm text-muted mb-2">
            <span>Subtotal</span>
            <span id="checkoutSubtotal">₦0</span>
          </div>
          <div class="flex justify-between text-lg font-bold text-ink">
            <span>Total</span>
            <span id="checkoutTotal">₦0</span>
          </div>
        </div>

        <div class="mt-6 space-y-3">
          <button id="whatsappCheckoutBtn" class="button-primary w-full">
            <i class="fa-brands fa-whatsapp mr-2"></i>Continue to WhatsApp
          </button>
          <button id="websiteCheckoutBtn" class="button-secondary w-full">
            <i class="fa-solid fa-credit-card mr-2"></i>Complete checkout on website
          </button>
        </div>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container-shell flex flex-col md:flex-row items-center justify-between gap-4">
      <p>© 2026 Flezible Eggs</p>
      <nav class="flex gap-5 text-sm text-muted">
        <a href="./about.html">About</a>
        <a href="./terms.html">Terms</a>
        <a href="./privacy.html">Privacy</a>
      </nav>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/script.js"></script>
</body>

</html>
