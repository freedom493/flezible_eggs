<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Flezible Eggs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: '#0f0f17', surface: '#1a1a2e', surfaceRaised: '#252540', amber: '#f59e0b', light: '#f5f5f5',
            egg: '#f7f1e8',
            cream: '#fffaf4',
            forest: '#173f2d',
            clay: '#b75b32',
            ink: '#1d1a17',
            line: '#e7dccd',
            muted: '#756a62'
          },
          fontFamily: {
            display: ['Fraunces', 'serif'],
            body: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body class="bg-dark text-light font-body min-h-screen">
  <header class="site-header">
    <div class="container-shell flex items-center justify-between py-4">
      <a href="./index.html" class="brand-mark" aria-label="Flezible Eggs homepage">
        <img src="./images/logo.png" alt="Flezible Eggs logo" class="brand-logo" />
      </a>
      <div class="relative flex items-center gap-3">
        <nav class="nav-menu hidden md:flex items-center gap-4 text-sm font-semibold text-muted">
          <a href="./index.html">Home</a>
        </nav>

        <button type="button" class="mobile-nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
          <i class="fa-solid fa-bars"></i>
        </button>
        <button id="logoutBtn" class="button-secondary text-sm px-4 py-2">Log out</button>
      </div>
    </div>
  </header>

  <main class="container-shell py-8 md:py-12">
    <div id="loading" class="text-center py-20 text-muted">Loading your dashboard...</div>

    <div id="app" class="hidden">
      <div class="site-card p-6 md:p-7 mb-6">
        <p class="text-xs uppercase tracking-[0.2em] text-clay font-bold mb-2">Your account</p>
        <h1 class="font-display text-4xl md:text-5xl">Dashboard</h1>
      </div>

      <div class="site-card p-3 md:p-4 mb-6">
        <div class="flex flex-wrap gap-2">
          <button type="button" class="tab-button active" data-tab="profile">Update Profile</button>
          <button type="button" class="tab-button" data-tab="orders">Orders</button>
        </div>
      </div>

      <div data-tab-panel="profile" class="site-card p-6 md:p-7">
        <h2 class="font-display text-2xl mb-4">Your details</h2>
        <form id="profileForm" class="space-y-5">
          <div>
            <label for="fullName" class="input-label">Full name</label>
            <input id="fullName" type="text" class="field" />
          </div>
          <div>
            <label for="phone" class="input-label">Phone</label>
            <input id="phone" type="tel" class="field" />
          </div>
          <div>
            <label for="deliveryAddress" class="input-label">Delivery address</label>
            <textarea id="deliveryAddress" rows="3" class="field"></textarea>
          </div>
          <label class="flex items-center gap-3 text-sm font-medium text-ink">
            <input id="notificationsEnabled" type="checkbox" class="w-4 h-4 accent-clay" />
            Receive order updates and notifications
          </label>
          <button type="submit" class="button-primary">Save changes</button>
          <div id="profileUpdateNotice" class="text-sm min-h-5"></div>
        </form>
      </div>

      <div data-tab-panel="orders" class="site-card p-6 md:p-7 hidden">
        <h2 class="font-display text-2xl mb-4">Order history</h2>
        <div id="orderList" class="space-y-3"></div>
      </div>
    </div>
  </main>

  <div id="trackingModal" class="modal-overlay hidden">
    <div class="modal-box w-full max-w-xl">
      <div id="trackingContent"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container-shell flex flex-col md:flex-row items-center justify-between gap-4">
      <p>© 2026 Flezible Eggs</p>
      <nav class="flex gap-5 text-sm text-muted">
        <a href="./about.html">About</a>
        <a href="./terms.html">Terms</a>
        <a href="./privacy.html">Privacy</a>
      </nav>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-client.js"></script>
  <script src="./js/script.js"></script>
</body>

</html>
