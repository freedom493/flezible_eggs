<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Flezible Eggs</title>
<style>
  :root {
    --bg: #fffaf0;
    --card: #ffffff;
    --text: #2b2210;
    --muted: #7a6f57;
    --accent: #e0a527;
    --accent-dark: #b9820f;
    --border: #ecdfc0;
    --error: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.06);
  }
  .logo { font-size: 28px; text-align: center; margin-bottom: 4px; }
  h1 {
    font-size: 20px;
    text-align: center;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--muted);
  }
  input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 16px;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #2b2210;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  .msg.error { color: var(--error); }
  .msg.success { color: #1e7e34; }
  .footer-link {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: var(--muted);
  }
  .footer-link a { color: var(--accent-dark); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">🥚</div>
  <h1>Create your Flezible Eggs account</h1>

  <form id="signup-form">
    <label for="full_name">Full name</label>
    <input type="text" id="full_name" required autocomplete="name">

    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email">

    <label for="password">Password</label>
    <input type="password" id="password" required minlength="6" autocomplete="new-password">

    <button type="submit" id="submit-btn">Sign Up</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="footer-link">
    Already have an account? <a href="login.html">Log in</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase-client.js"></script>
<script>
  const form = document.getElementById("signup-form");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "";
    msg.className = "msg";
    btn.disabled = true;
    btn.textContent = "Creating account...";

    const full_name = document.getElementById("full_name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { data, error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: {
        data: { full_name } // stored in auth.users.raw_user_meta_data for now
      }
    });

    btn.disabled = false;
    btn.textContent = "Sign Up";

    if (error) {
      msg.textContent = error.message;
      msg.className = "msg error";
      return;
    }

    // If email confirmation is off, Supabase returns a session immediately.
    if (data.session) {
      window.location.href = "dashboard.html";
    } else {
      msg.textContent = "Account created! Check your email to confirm, then log in.";
      msg.className = "msg success";
      form.reset();
    }
  });
</script>

</body>
</html>
