<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Flezible Eggs</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: '#0f0f17', surface: '#1a1a2e', surfaceRaised: '#252540', amber: '#f59e0b', light: '#f5f5f5',
            brand: { DEFAULT: '#f59e0b', dark: '#d97706' },
            cream: '#0f0f17', ink: '#f5f5f5', muted: '#8888a0',
            line: '#2a2a40', success: '#22c55e', yolk: '#fbbf24'
          },
          fontFamily: { display: ['Sora', 'sans-serif'], body: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    .field {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border: 1px solid #2a2a40;
      border-radius: 10px;
      font-size: 15px;
      background: #252540;
      color: #f5f5f5;
      outline: none;
    }

    .field:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, .15);
    }

    .field-wrap {
      position: relative;
    }

    .field-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #8888a0;
    }
  </style>
</head>

<body class="bg-dark text-light font-body min-h-screen flex items-center justify-center p-6">

  <div class="auth-card w-full max-w-[380px]">
    <div class="flex justify-center mb-3">
      <img src="./images/logo.png" alt="Flezible Eggs logo" class="w-[90px] h-[90px] rounded-xl" />
    </div>
    <h1 class="font-display font-extrabold text-xl text-center mb-6">Create your Flezible Eggs account</h1>

    <form id="signup-form" class="space-y-4">
      <div>
        <label for="full_name" class="block text-xs font-bold text-muted mb-1.5">Full name</label>
        <div class="field-wrap">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="full_name" required autocomplete="name" class="field">
        </div>
      </div>

      <div>
        <label for="email" class="block text-xs font-bold text-muted mb-1.5">Email</label>
        <div class="field-wrap">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="email" required autocomplete="email" class="field">
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-bold text-muted mb-1.5">Password</label>
        <div class="field-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" required minlength="6" autocomplete="new-password" class="field">
        </div>
      </div>

      <button type="submit" id="submit-btn" class="button-primary w-full">
        Sign Up
      </button>
      <div class="msg text-sm text-center min-h-[18px]" id="msg"></div>
    </form>

    <div class="text-center mt-5 text-sm text-muted">
      Already have an account? <a href="login.html" class="text-brand-dark font-bold no-underline">Log in</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-client.js"></script>
  <script>
    const form = document.getElementById("signup-form");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submit-btn");
    const returnTo = new URLSearchParams(window.location.search).get("redirect") || "dashboard.html";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      msg.className = "msg text-sm text-center min-h-[18px]";
      btn.disabled = true;
      btn.textContent = "Creating account...";

      const full_name = document.getElementById("full_name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { full_name } }
      });

      btn.disabled = false;
      btn.textContent = "Sign Up";

      if (error) {
        msg.textContent = error.message;
        msg.classList.add("text-red-600");
        return;
      }

      if (data.session) {
        window.location.href = returnTo;
      } else {
        msg.textContent = "Account created! Check your email to confirm, then log in.";
        msg.classList.add("text-green-700");
        form.reset();
      }
    });
  </script>

</body>

</html>
